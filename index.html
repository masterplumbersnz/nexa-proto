<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXA Evidence</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<section id="signIn">
  <h1>NEXA Evidence</h1>
  <input id="emailInput" type="email" placeholder="your email">
  <button onclick="signIn()">Sign in</button>
  <p id="notInvited" hidden>Email not found — check with your assessor.</p>
</section>

<section id="home" hidden>
        <h2 id="welcome"></h2>
        <div id="projectList"></div>
    </section>

    <section id="tasks" hidden>
        <h2 id="projectTitle"></h2>
        <div id="taskList"></div>
        <button onclick="show('#home')">Back</button>
    </section>

    <section id="subtasks" hidden>
        <h2 id="taskTitle"></h2>
        <div id="subtaskList"></div>
        <button onclick="show('#tasks')">Back</button>
    </section>

    <section id="capture" hidden>
        <h2 id="captureTitle">Add photo</h2>
        <input type="file" accept="image/*" capture="environment" id="cam">
        <p id="status"></p>
        <button onclick="show('#subtasks')">Back</button>
    </section>

    <section id="review" hidden>
        <h2 id="reviewTitle"></h2>
        <div id="evidenceList"></div>
        <textarea id="reviewComment" placeholder="Optional feedback for the learner…" rows="3"
            style="width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #ccc;"></textarea>
        <div id="reviewActions"></div>
        <p id="reviewStatus"></p>
        <button onclick="show('#subtasks')">Back</button>
    </section>


<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
